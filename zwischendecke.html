<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; display: block; margin: 0; padding: 0;">
  
  <!-- Header -->
  <text x="50" y="45" font-size="20" font-weight="700" fill="#0F172A">4. Holzbalkendecke / Zwischendecke EG-OG (ca. 380 mm Gesamtdicke)</text>

  <!-- Unified Legend Top-Right (Technical Specs) -->
  <g transform="translate(560, 32)" font-size="11" font-weight="600">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#F59E0B"/>
    <text x="18" y="10" fill="#334155">Holztragwerk</text>

    <rect x="118" y="0" width="12" height="12" rx="3" fill="#EF4444"/>
    <text x="136" y="10" fill="#334155">Fußbodenheizung</text>

    <rect x="258" y="0" width="12" height="12" rx="3" fill="#3B82F6"/>
    <text x="276" y="10" fill="#334155">Schallschutz</text>

  <line x1="50" y1="85" x2="950" y2="85" stroke="#E2E8F0" stroke-width="1"/>

  <text x="50" y="555" font-size="12" font-weight="700" fill="#16A34A">▼ ERDGESCHOSS (Decke EG)</text>

  <!-- VERTICAL 2D VECTOR CUTAWAY LAYERS (BOTTOM TO TOP) -->

  <!-- 1. Gipsfaser 15 mm (Decke EG) -->
  <g id="layer-rigips">
    <rect x="140" y="515" width="400" height="18" fill="#94A3B8" stroke="#475569" stroke-width="1"/>
    <text x="340" y="528" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">1. Gipsfaser / Rigips (15 mm Decke EG abgehängt)</text>
  </g>

  <!-- 2. Konterlattung 50 mm (Installationsebene) -->
  <g id="layer-lattung">
    <rect x="140" y="470" width="400" height="45" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3,3"/>
    <rect x="180" y="470" width="35" height="45" fill="#FEF3C7" stroke="#D97706"/>
    <rect x="320" y="470" width="35" height="45" fill="#FEF3C7" stroke="#D97706"/>
    <rect x="460" y="470" width="35" height="45" fill="#FEF3C7" stroke="#D97706"/>

  </g>

  <g id="layer-balken">
    <rect x="140" y="270" width="400" height="200" fill="#E2E8F0" opacity="0.6" stroke="#94A3B8"/>
    <rect x="140" y="270" width="65" height="200" fill="#F59E0B" stroke="#D97706"/>

  <!-- 4. 22 mm OSB/3 Nut-und-Feder Tragschicht -->
  <g id="layer-osb">
    <rect x="140" y="240" width="400" height="30" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>

  </g>

  <!-- 5. Gebundene Trockenschüttung 40 mm -->
  <g id="layer-schuettung">

  </g>

  <!-- 6. Trockenestrich mit PEX FBH (25 mm) -->
  <g id="layer-selfio">
    <rect x="140" y="155" width="400" height="35" fill="#FCA5A5" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="190" cy="172" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="265" cy="172" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="340" cy="172" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="415" cy="172" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="490" cy="172" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <text x="340" y="148" fill="#B91C1C" font-size="10" font-weight="700" text-anchor="middle">6. Trockenestrich mit FBH (25 mm)</text>
  </g>

  <!-- 7. Oberbelag OG -->
  <g id="layer-parkett">
    <rect x="140" y="130" width="400" height="25" fill="#B8860B" stroke="#78350F" stroke-width="1"/>
    <text x="340" y="147" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">7. Fertigfußboden OG (Parkett / Laminat)</text>
  </g>

  <!-- Right: Clean Summary Table (Neutral Specs) -->
  <g transform="translate(580, 110)" font-size="12">
    <rect x="0" y="0" width="370" height="490" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Table Rows -->
    <g transform="translate(20, 75)">
      <!-- Row 7 -->
      <text x="0" y="0" font-weight="700" fill="#78350F">7. Oberbelag (Parkett/Laminat)</text>
      <text x="230" y="0" font-weight="600" fill="#78350F">[ Parkett / Vinyl ]</text>
      <line x1="0" y1="12" x2="330" y2="12" stroke="#F1F5F9"/>

      <!-- Row 6 -->
      <text x="0" y="35" font-weight="700" fill="#DC2626">6. Trockenestrich + FBH</text>
      <text x="230" y="35" font-weight="600" fill="#EF4444">[ 25 mm FBH ]</text>
      <line x1="0" y1="47" x2="330" y2="47" stroke="#F1F5F9"/>

      <!-- Row 5 -->
      <text x="0" y="70" font-weight="700" fill="#334155">5. Schüttung (40 mm Trittschall)</text>
      <text x="230" y="70" font-weight="600" fill="#475569">[ 40 mm Schüttung ]</text>
      <line x1="0" y1="82" x2="330" y2="82" stroke="#F1F5F9"/>

      <!-- Row 4 -->
      <text x="0" y="105" font-weight="700" fill="#D97706">4. OSB/3 Tragschicht (22 mm)</text>
      <text x="230" y="105" font-weight="600" fill="#D97706">[ 22 mm OSB/3 ]</text>
      <line x1="0" y1="117" x2="330" y2="117" stroke="#F1F5F9"/>

      <!-- Row 3 -->
      <text x="0" y="140" font-weight="700" fill="#B45309">3. Deckenbalken (240 mm)</text>
      <text x="230" y="140" font-weight="600" fill="#D97706">[ 240 mm KVH ]</text>
      <line x1="0" y1="152" x2="330" y2="152" stroke="#F1F5F9"/>

      <!-- Row 2 -->
      <text x="0" y="175" font-weight="700" fill="#B45309">2. Konterlattung (50 mm)</text>
      <text x="230" y="175" font-weight="600" fill="#D97706">[ 50 mm Lattung ]</text>
      <line x1="0" y1="187" x2="330" y2="187" stroke="#F1F5F9"/>

      <!-- Row 1 -->
      <text x="0" y="210" font-weight="700" fill="#334155">1. Gipsfaser / Rigips (15 mm)</text>
      <text x="230" y="210" font-weight="600" fill="#475569">[ 15 mm Gipsfaser ]</text>
    </g>

    <!-- Key Performance Box -->
    <rect x="20" y="355" width="330" height="115" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="380" font-size="12" font-weight="700" fill="#0F172A">Deckenleistung &amp; Schallschutz:</text>
    <text x="35" y="403" font-size="11" fill="#475569">• Trittschalldämmung: L'n,w &lt; 46 dB (Entkoppelt)</text>
    <text x="35" y="423" font-size="11" fill="#475569">• Fußbodenheizung: Trockensystem (Kein Nassestrich)</text>
    <text x="35" y="443" font-size="11" fill="#475569">• Deckenabhang EG: 50 mm Raum für Kabel &amp; Spots</text>
  </g>

</svg>
