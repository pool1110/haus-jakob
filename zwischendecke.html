<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; display: block; margin: 0; padding: 0;">
  
  <!-- Header -->
  <text x="50" y="45" font-size="20" font-weight="700" fill="#0F172A">4. Holzbalkendecke / Zwischendecke EG-OG (ca. 417 mm mit 50 mm Nassestrich auf FBH &amp; Trittschall)</text>
  <text x="50" y="68" font-size="13" font-weight="500" fill="#64748B">Maximaler Trittschallschutz (Ln,w &lt; 38 dB) | Schwimmender 5 cm Estrich | Vertikaler Schnitt</text>

  <line x1="50" y1="85" x2="950" y2="85" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Level Indicators Side -->
  <text x="50" y="115" font-size="12" font-weight="700" fill="#2563EB">▲ OBERGESCHOSS (Wohnbereich OG)</text>
  <text x="50" y="565" font-size="12" font-weight="700" fill="#16A34A">▼ ERDGESCHOSS (Decke EG)</text>

  <!-- VERTICAL 2D VECTOR CUTAWAY LAYERS (BOTTOM TO TOP) -->

  <!-- 1. Gipsfaser / Rigips 15 mm (Decke EG) -->
  <g id="layer-rigips">
    <rect x="140" y="525" width="400" height="18" fill="#94A3B8" stroke="#475569" stroke-width="1"/>
    <text x="340" y="538" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">1. Gipsfaser / Rigips Decke EG (15 mm abgehängt)</text>
  </g>

  <!-- 2. Konterlattung / Entkopplung 50 mm -->
  <g id="layer-lattung">
    <rect x="140" y="480" width="400" height="45" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3,3"/>
    <rect x="180" y="480" width="35" height="45" fill="#FEF3C7" stroke="#D97706"/>
    <rect x="320" y="480" width="35" height="45" fill="#FEF3C7" stroke="#D97706"/>
    <rect x="460" y="480" width="35" height="45" fill="#FEF3C7" stroke="#D97706"/>
    <text x="340" y="507" fill="#B45309" font-size="11" font-weight="700" text-anchor="middle">2. Konterlattung / Installationsebene (50 mm)</text>
  </g>

  <!-- 3. Deckenbalken 240 mm + Zellulose/Hohlraumdämmung -->
  <g id="layer-balken">
    <rect x="140" y="280" width="400" height="200" fill="#E2E8F0" opacity="0.6" stroke="#94A3B8"/>
    <rect x="140" y="280" width="65" height="200" fill="#F59E0B" stroke="#D97706"/>
    <rect x="307" y="280" width="65" height="200" fill="#F59E0B" stroke="#D97706"/>
    <rect x="475" y="280" width="65" height="200" fill="#F59E0B" stroke="#D97706"/>
    <text x="250" y="375" fill="#B45309" font-size="12" font-weight="700" text-anchor="middle">3. KVH Deckenbalken (240 mm)</text>
    <text x="250" y="395" fill="#2563EB" font-size="11" font-weight="600" text-anchor="middle">+ Hohlraum-Schalldämmung</text>
  </g>

  <!-- 4. 22 mm OSB/3 Nut-und-Feder Tragschicht -->
  <g id="layer-osb">
    <rect x="140" y="250" width="400" height="30" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <text x="340" y="270" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">4. OSB/3 Nut-und-Feder Tragschicht (22 mm verleimt)</text>
  </g>

  <!-- 5. 30 mm Trittschalldämmung (Mineralwolle/Holzfaser STEICOsound) -->
  <g id="layer-trittschall">
    <rect x="140" y="215" width="400" height="35" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="340" y="237" fill="#854D0E" font-size="11" font-weight="700" text-anchor="middle">5. Trittschalldämmung (30 mm hochdämpfend s' ≤ 15 MN/m³)</text>
  </g>

  <!-- 6. 50 mm Schwimmender Nassestrich mit PEX FBH -->
  <g id="layer-estrich">
    <rect x="140" y="160" width="400" height="55" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
    <!-- FBH Pipes in Estrich -->
    <circle cx="180" cy="188" r="8" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="260" cy="188" r="8" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="340" cy="188" r="8" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="420" cy="188" r="8" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="500" cy="188" r="8" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <!-- Randdämmstreifen links/rechts -->
    <rect x="135" y="160" width="5" height="55" fill="#EF4444"/>
    <rect x="540" y="160" width="5" height="55" fill="#EF4444"/>
    <text x="340" y="177" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">6. Schwimmender Nassestrich (50 mm) + FBH</text>
  </g>

  <!-- 7. Oberbelag OG (17 mm Parkett / Vinyl) -->
  <g id="layer-parkett">
    <rect x="140" y="135" width="400" height="25" fill="#B8860B" stroke="#78350F" stroke-width="1"/>
    <text x="340" y="152" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">7. Fertigfußboden OG (17 mm Parkett / Vinyl)</text>
  </g>

  <!-- Right: Clean Summary Table (Clean Schichtaufbau List) -->
  <g transform="translate(560, 110)" font-size="12">
    <rect x="0" y="0" width="390" height="510" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0F172A">Schichtaufbau &amp; Dimensionierung (417 mm)</text>
    <text x="20" y="48" font-size="11" font-weight="500" fill="#64748B">Von oben (Wohnen OG) nach unten (Decke EG):</text>

    <!-- Table Rows -->
    <g transform="translate(20, 75)" font-size="11">
      <!-- Row 7 -->
      <text x="0" y="0" font-weight="700" fill="#78350F">7. Fertigfußboden OG (17 mm Parkett / Vinyl bauseits)</text>
      <line x1="0" y1="12" x2="350" y2="12" stroke="#F1F5F9"/>

      <!-- Row 6 -->
      <text x="0" y="35" font-weight="700" fill="#0F172A">6. Schwimmender Nassestrich (50 mm) + FBH (bauseits in DE)</text>
      <line x1="0" y1="47" x2="350" y2="47" stroke="#F1F5F9"/>

      <!-- Row 5 -->
      <text x="0" y="70" font-weight="700" fill="#D97706">5. Trittschalldämmung (30 mm bauseits in DE)</text>
      <line x1="0" y1="82" x2="350" y2="82" stroke="#F1F5F9"/>

      <!-- Row 4 -->
      <text x="0" y="96" font-weight="700" fill="#D97706">4. OSB/3 Nut-und-Feder 22 mm Tragschicht (bauseits in DE)</text>
      <line x1="0" y1="108" x2="350" y2="108" stroke="#F1F5F9"/>

      <!-- Row 3 -->
      <text x="0" y="122" font-weight="700" fill="#16A34A">3. KVH Deckenbalken 240 mm (Palmatin ab Werk)</text>
      <line x1="0" y1="134" x2="350" y2="134" stroke="#F1F5F9"/>

      <!-- Row 2 -->
      <text x="0" y="148" font-weight="700" fill="#B45309">2. Konterlattung / Inst.-Ebene 50 mm (bauseits)</text>
      <line x1="0" y1="160" x2="350" y2="160" stroke="#F1F5F9"/>

      <!-- Row 1 -->
      <text x="0" y="174" font-weight="700" fill="#334155">1. Rigips Decke EG 12,5 mm (bauseits in DE)</text>
    </g>

    <!-- Key Performance Box -->
    <rect x="20" y="335" width="350" height="155" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="358" font-size="12" font-weight="700" fill="#0F172A">Lieferumfang &amp; Trittschallpegel (417 mm):</text>
    <text x="35" y="378" font-size="11" font-weight="700" fill="#16A34A">• Palmatin Werkssatz: Schicht 3 (240mm KVH Balkenlage ab Werk)</text>
    <text x="35" y="398" font-size="11" font-weight="700" fill="#D97706">• Bauseitiger Zukauf DE: 22mm OSB + 30mm Trittschall + 50mm Estrich</text>
    <text x="35" y="418" font-size="11" fill="#16A34A">• Trittschallpegel: Ln,w &lt; 38 dB (Exzellent leise &amp; massiv!)</text>
    <text x="35" y="438" font-size="11" fill="#475569">• Masse: ca. 110 kg/m² Estrich verhindert Schwingungen</text>
  </g>

</svg>
