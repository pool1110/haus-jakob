<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; display: block; margin: 0; padding: 0;">
  
  <!-- Header -->
  <text x="50" y="45" font-size="20" font-weight="700" fill="#0F172A">3. Dachaufbau KfW-40 (392 mm Sparrendach unbeheizt mit 60 mm STEICO &amp; 12 mm OSB)</text>
  <text x="50" y="68" font-size="13" font-weight="500" fill="#64748B">U-Wert ≈ 0,12 W/m²K | Phasenverschiebung > 15 Std. | Horizontaler Schnitt (Außen bis Innen)</text>

  <line x1="50" y1="85" x2="950" y2="85" stroke="#E2E8F0" stroke-width="1"/>

  <text x="500" y="115" font-size="12" font-weight="700" text-anchor="end" fill="#16A34A">INNEN (Dachraum unbeheizt)</text>

  <!-- 2D Vector Cutaway Layers (Left to Right) -->
  
  <!-- 1. Dachziegel / Eindeckung (20mm) -->
  <rect x="70" y="130" width="20" height="340" fill="#B91C1C" stroke="#991B1B" stroke-width="1"/>
  <text x="80" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">1</text>

  <!-- 2. Standard Trag- & Konterlattung (60mm) -->
  <rect x="90" y="130" width="35" height="340" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3,3"/>
  <rect x="90" y="160" width="35" height="40" fill="#FEF3C7" stroke="#D97706"/>
  <rect x="90" y="380" width="35" height="40" fill="#FEF3C7" stroke="#D97706"/>
  <text x="107" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">2</text>

  <!-- 3. Holzfaser-Unterdeckplatte STEICO (60mm) -->
  <rect x="125" y="130" width="52" height="340" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="151" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">3</text>

  <!-- 4. Dachsparren 240mm + Zellulose -->
  <rect x="177" y="130" width="195" height="340" fill="#E2E8F0" opacity="0.6" stroke="#94A3B8"/>
  <rect x="177" y="130" width="195" height="40" fill="#F59E0B" stroke="#D97706"/>
  <rect x="177" y="430" width="195" height="40" fill="#F59E0B" stroke="#D97706"/>

  <text x="274" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">4</text>

  <rect x="372" y="130" width="18" height="340" fill="#FDE68A" stroke="#2563EB" stroke-width="2"/>
  <text x="381" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">5</text>

  <!-- Right: Clean Summary Table (Clean Schichtaufbau List) -->
  <g transform="translate(560, 110)" font-size="12">
    <rect x="0" y="0" width="390" height="490" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0F172A">Schichtaufbau &amp; Dimensionierung (392 mm)</text>
    <text x="20" y="48" font-size="11" font-weight="500" fill="#64748B">Von außen (Dach) nach innen (Dachraum):</text>

    <!-- Table Rows -->
    <g transform="translate(20, 75)" font-size="11">
      <!-- Row 1 -->

      <line x1="0" y1="47" x2="350" y2="47" stroke="#F1F5F9"/>

      <!-- Row 3 -->

      <line x1="0" y1="82" x2="350" y2="82" stroke="#F1F5F9"/>

      <line x1="0" y1="117" x2="350" y2="117" stroke="#F1F5F9"/>

      <!-- Row 5 -->
      <text x="0" y="140" font-weight="700" fill="#2563EB">5. OSB/3 (12 mm stoßverklebt) als Dampfbremse &amp; Beplankung</text>
    </g>

    <!-- Key Performance Box -->
    <rect x="20" y="335" width="350" height="145" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="358" font-size="12" font-weight="700" fill="#0F172A">Dachleistung &amp; Lieferumfang (392 mm):</text>
    <text x="35" y="378" font-size="11" font-weight="700" fill="#16A34A">• Palmatin Werkssatz: 240mm Sparren, Pfetten &amp; Lattung ab Werk</text>
    <text x="35" y="398" font-size="11" font-weight="700" fill="#D97706">• Bauseitiger Zukauf DE: Dachpfannen / Tondachziegel (bauseits)</text>
    <text x="35" y="418" font-size="11" fill="#475569">• U-Wert: ca. 0,120 W/(m²K) (Hocheffizient KfW-40)</text>
    <text x="35" y="438" font-size="11" fill="#475569">• Dämmung: 60 mm STEICO + 240 mm Sparren</text>
    <text x="35" y="458" font-size="11" fill="#16A34A">• Dampfbremse: OSB/3 stoßverklebt als Dachraumabschluss</text>
  </g>

</svg>
