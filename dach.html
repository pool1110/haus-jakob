<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; display: block; margin: 0; padding: 0;">
  
  <!-- Header -->
  <text x="50" y="45" font-size="20" font-weight="700" fill="#0F172A">3. Dachaufbau KfW-40 (372 mm Sparrendach unbeheizt mit OSB als Dampfbremse)</text>
  <text x="50" y="68" font-size="13" font-weight="500" fill="#64748B">U-Wert ≈ 0,13 W/m²K | Phasenverschiebung > 14 Std. | Horizontaler Schnitt (Außen bis Innen)</text>

  <text x="80" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">1</text>

  <!-- 2. Trag- & Konterlattung (70mm) -->
  <rect x="90" y="130" width="40" height="340" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="3,3"/>
  <rect x="90" y="160" width="40" height="40" fill="#FEF3C7" stroke="#D97706"/>
  <rect x="90" y="380" width="40" height="40" fill="#FEF3C7" stroke="#D97706"/>
  <text x="110" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">2</text>

  <!-- 3. Holzfaser-Unterdeckplatte (50mm) -->
  <rect x="130" y="130" width="45" height="340" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="152" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">3</text>

  <!-- 4. Dachsparren 240mm + Zellulose -->
  <rect x="175" y="130" width="195" height="340" fill="#E2E8F0" opacity="0.6" stroke="#94A3B8"/>
  <rect x="175" y="130" width="195" height="40" fill="#F59E0B" stroke="#D97706"/>
  <rect x="175" y="430" width="195" height="40" fill="#F59E0B" stroke="#D97706"/>

  <text x="272" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">4</text>

  <text x="379" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">5</text>

  <g transform="translate(560, 110)" font-size="12">
    <rect x="0" y="0" width="390" height="490" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0F172A">Schichtaufbau &amp; Dimensionierung (372 mm)</text>

    <g transform="translate(20, 75)" font-size="11">

      <!-- Row 4 -->

      <!-- Row 5 -->
      <text x="0" y="140" font-weight="700" fill="#2563EB">5. OSB/3 (12 mm stoßverklebt) als Dampfbremse &amp; Beplankung</text>
    </g>

    <rect x="20" y="335" width="350" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="360" font-size="12" font-weight="700" fill="#0F172A">Dachleistung KfW-40 (unausgebaut):</text>
    <text x="35" y="383" font-size="11" fill="#475569">• U-Wert: ca. 0,13 W/(m²K)</text>
    <text x="35" y="403" font-size="11" fill="#475569">• Dampfbremse: OSB/3 stoßverklebt (keine Folie an Dach)</text>
    <text x="35" y="423" font-size="11" fill="#475569">• Hitzeschutz &amp; Schallschutz: Phasenverschiebung > 14 Std.</text>
    <text x="35" y="443" font-size="11" fill="#16A34A">• Robuster, sauberer Dachraumabschluss</text>
  </g>

</svg>
