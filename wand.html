<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; display: block; margin: 0; padding: 0;">
  
  <!-- Header -->
  <text x="50" y="45" font-size="20" font-weight="700" fill="#0F172A">2. Wandaufbau KfW-40 (414 mm Gesamtdicke mit 18 mm Fichtenholz + 60 mm STEICO + 2x 12 mm OSB + 12 mm Rigips)</text>
  <text x="50" y="68" font-size="13" font-weight="500" fill="#64748B">U-Wert ≈ 0,12 W/m²K | Phasenverschiebung > 15 Std. | Horizontaler Schnitt (Außen bis Innen)</text>

  <text x="106" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">2</text>

  <rect x="120" y="130" width="52" height="340" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="146" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">3</text>

  <rect x="172" y="130" width="210" height="40" fill="#FEF3C7" stroke="#D97706"/>
  <rect x="172" y="430" width="210" height="40" fill="#FEF3C7" stroke="#D97706"/>

  <text x="277" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">4</text>

  <rect x="382" y="130" width="18" height="340" fill="#FDE68A" stroke="#2563EB" stroke-width="2"/>
  <text x="391" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">5</text>

  <rect x="400" y="130" width="50" height="340" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="400" y="240" width="50" height="30" fill="#93C5FD" stroke="#2563EB"/>

      <line x1="0" y1="8" x2="350" y2="8" stroke="#F1F5F9"/>

      <line x1="0" y1="104" x2="350" y2="104" stroke="#F1F5F9"/>

      <line x1="0" y1="128" x2="350" y2="128" stroke="#F1F5F9"/>

      <!-- Row 7 -->
      <text x="0" y="144" font-weight="700" fill="#D97706">7. OSB/3 Platte über Inst.-Ebene (12 mm)</text>
      <line x1="0" y1="152" x2="350" y2="152" stroke="#F1F5F9"/>

      <!-- Row 8 -->
      <text x="0" y="160" font-weight="700" fill="#334155">8. Rigips Gipskartonplatte (12 mm)</text>
    </g>

    <!-- Key Performance Box -->
    <rect x="20" y="380" width="350" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="403" font-size="12" font-weight="700" fill="#0F172A">Wandleistung KfW-40 Premium (414 mm):</text>
    <text x="35" y="425" font-size="11" fill="#475569">• U-Wert: ca. 0,12 W/(m²K) (Hocheffizient)</text>

    <text x="35" y="485" font-size="11" fill="#475569">• Dampfbremse: OSB/3 verklebt (keine Folie an Wand)</text>
    <text x="35" y="505" font-size="11" fill="#D97706">• Fassade: 18 mm Fichtenholz-Schalung (lasiert/lackiert)</text>
  </g>
