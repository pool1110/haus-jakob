<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innenwandaufbau mit 80 mm Ständer & Doppelbeplankung (129 mm) | Haus Jakob</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; color: #0F172A; overflow-x: hidden; }
        svg { display: block; width: 100%; height: 100%; max-height: 100vh; }
    </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; display: block; margin: 0; padding: 0;">
  
  <defs>
    <!-- Pattern für Steinwolle-Dämmung -->
    <pattern id="pat-steinwolle" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#FEF3C7"/>
      <path d="M 0,6 Q 6,0 12,6 T 24,6" fill="none" stroke="#D97706" stroke-width="1.2" opacity="0.6"/>
      <path d="M 0,18 Q 6,12 12,18 T 24,18" fill="none" stroke="#D97706" stroke-width="1.2" opacity="0.6"/>
    </pattern>

    <!-- Pattern für OSB-Platten -->
    <pattern id="pat-osb" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#FDE68A"/>
      <line x1="2" y1="5" x2="10" y2="5" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>
      <line x1="12" y1="15" x2="18" y2="15" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>
      <line x1="5" y1="12" x2="15" y2="12" stroke="#92400E" stroke-width="1.2" opacity="0.6"/>
    </pattern>

    <!-- Pattern für Gipskarton -->
    <pattern id="pat-gipskarton" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#E2E8F0"/>
      <circle cx="8" cy="8" r="1" fill="#94A3B8"/>
      <circle cx="3" cy="3" r="0.8" fill="#64748B" opacity="0.5"/>
      <circle cx="13" cy="13" r="0.8" fill="#64748B" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- ==================== HEADER (KOMPAKT & EDEL) ==================== -->
  <g transform="translate(45, 26)">
    <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#0F172A">3. Innenwand (129 mm)</text>
    <text x="0" y="44" font-size="12" font-weight="500" fill="#64748B">Schallschutz Rw ≈ 52 dB  •  Standard-Türzarge 130 mm  •  Schwere Lasten bis 50 kg/Schraube</text>
  </g>

  <!-- Button zur Außenwand (oben rechts, frei platziert) -->
  <a href="wand.html" target="_self" style="cursor: pointer;">
    <g transform="translate(775, 26)">
      <rect x="0" y="0" width="180" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="90" y="24" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">➔ Zur Außenwand (374 mm)</text>
    </g>
  </a>

  <line x1="45" y1="88" x2="955" y2="88" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Raumbezeichnungen exakt über den Wandkanten -->
  <text x="70" y="115" font-size="12" font-weight="700" fill="#2563EB">RAUM A (z. B. Flur / Wohnen)</text>
  <text x="324" y="115" font-size="12" font-weight="700" text-anchor="end" fill="#16A34A">RAUM B (z. B. Zimmer / Bad)</text>

  <!-- ==================== 2D VECTOR CUTAWAY LAYERS (LINKS NACH RECHTS) ==================== -->
  
  <!-- 1. Gips-Karton-Platte 12,5 mm (Raum A) -->
  <rect x="70" y="128" width="22" height="340" fill="url(#pat-gipskarton)" stroke="#64748B" stroke-width="1.5" rx="1"/>
  <text x="81" y="492" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">1</text>

  <!-- 2. OSB/3-Platte 12 mm (Raum A) -->
  <rect x="92" y="128" width="22" height="340" fill="url(#pat-osb)" stroke="#B45309" stroke-width="1.5" rx="1"/>
  <text x="103" y="492" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">2</text>

  <!-- 3. KVH Ständerwerk 80 mm + Steinwolle 80 mm -->
  <g id="layer-staender-steinwolle">
    <!-- Vollflächiges Gefach mit 80 mm Steinwolle gefüllt -->
    <rect x="114" y="128" width="166" height="340" fill="url(#pat-steinwolle)" stroke="#D97706" stroke-width="1.5"/>
    
    <!-- Oberer Holzständer KVH (80 mm Tiefe x 60 mm Breite) -->
    <rect x="114" y="128" width="166" height="45" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <line x1="114" y1="128" x2="280" y2="173" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="114" y1="173" x2="280" y2="128" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Unterer Holzständer KVH -->
    <rect x="114" y="423" width="166" height="45" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <line x1="114" y1="423" x2="280" y2="468" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="114" y1="468" x2="280" y2="423" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Zentrierte Beschriftung im Gefach -->
    <rect x="122" y="268" width="150" height="55" rx="8" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" stroke-width="1"/>
    <text x="197" y="291" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">80 mm Steinwolle</text>
    <text x="197" y="310" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">(Akustikfilz WLG 035)</text>

    <!-- Ständerholz-Label -->
    <text x="197" y="155" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">KVH Ständer 80 mm</text>
    <text x="197" y="450" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Palmatin Werkssatz</text>
    <text x="197" y="492" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">3</text>
  </g>

  <!-- 4. OSB/3-Platte 12 mm (Raum B) -->
  <rect x="280" y="128" width="22" height="340" fill="url(#pat-osb)" stroke="#B45309" stroke-width="1.5" rx="1"/>
  <text x="291" y="492" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">4</text>

  <!-- 5. Gips-Karton-Platte 12,5 mm (Raum B) -->
  <rect x="302" y="128" width="22" height="340" fill="url(#pat-gipskarton)" stroke="#64748B" stroke-width="1.5" rx="1"/>
  <text x="313" y="492" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">5</text>

  <!-- ==================== MASSKETTEN (UNTEN) ==================== -->
  <g transform="translate(0, 520)" font-size="10" font-family="'Inter', sans-serif">
    <!-- Maß 12,5 mm GKB -->
    <line x1="70" y1="0" x2="92" y2="0" stroke="#64748B" stroke-width="1.5"/>
    <line x1="70" y1="-5" x2="70" y2="5" stroke="#64748B" stroke-width="1.5"/>
    <line x1="92" y1="-5" x2="92" y2="5" stroke="#64748B" stroke-width="1.5"/>
    <text x="81" y="14" text-anchor="middle" font-weight="700" fill="#64748B">12,5</text>

    <!-- Maß 12 mm OSB -->
    <line x1="92" y1="0" x2="114" y2="0" stroke="#D97706" stroke-width="1.5"/>
    <line x1="114" y1="-5" x2="114" y2="5" stroke="#D97706" stroke-width="1.5"/>
    <text x="103" y="14" text-anchor="middle" font-weight="700" fill="#D97706">12</text>

    <!-- Maß 80 mm Steinwolle / Ständer -->
    <line x1="114" y1="0" x2="280" y2="0" stroke="#0F172A" stroke-width="2"/>
    <line x1="280" y1="-5" x2="280" y2="5" stroke="#0F172A" stroke-width="1.5"/>
    <text x="197" y="15" text-anchor="middle" font-size="11" font-weight="800" fill="#0F172A">80 mm Ständer / Steinwolle</text>

    <!-- Maß 12 mm OSB -->
    <line x1="280" y1="0" x2="302" y2="0" stroke="#D97706" stroke-width="1.5"/>
    <line x1="302" y1="-5" x2="302" y2="5" stroke="#D97706" stroke-width="1.5"/>
    <text x="291" y="14" text-anchor="middle" font-weight="700" fill="#D97706">12</text>

    <!-- Maß 12,5 mm GKB -->
    <line x1="302" y1="0" x2="324" y2="0" stroke="#64748B" stroke-width="1.5"/>
    <line x1="324" y1="-5" x2="324" y2="5" stroke="#64748B" stroke-width="1.5"/>
    <text x="313" y="14" text-anchor="middle" font-weight="700" fill="#64748B">12,5</text>

    <!-- Gesamtwandstärke Klammer -->
    <line x1="70" y1="32" x2="324" y2="32" stroke="#2563EB" stroke-width="2"/>
    <polyline points="65,32 75,28 75,36" fill="#2563EB"/>
    <polyline points="329,32 319,28 319,36" fill="#2563EB"/>
    <rect x="147" y="22" width="100" height="20" rx="4" fill="#2563EB"/>
    <text x="197" y="36" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">Gesamt: 129 mm</text>
  </g>

  <!-- ==================== RECHTS: STRUKTURIERTE TABELLE & HIGHLIGHTS ==================== -->
  <g transform="translate(380, 105)" font-size="12">
    <rect x="0" y="0" width="575" height="535" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="25" y="28" font-size="14" font-weight="800" fill="#0F172A">Schichtaufbau &amp; Dimensionierung (129 mm – ca. 13 cm)</text>
    <text x="25" y="46" font-size="11" font-weight="500" fill="#64748B">Der optimale Kompromiss aus maximalem Schallschutz, schlanker Bauweise &amp; Standard-Türzargen:</text>

    <!-- Table Rows -->
    <g transform="translate(25, 68)" font-size="11">
      <!-- Schicht 1 -->
      <text x="0" y="0" font-weight="700" fill="#475569">1. Gips-Karton-Platte 12,5 mm (Typ A / GKB)</text>
      <text x="0" y="14" font-size="10" fill="#64748B">Glatte Oberfläche für Malervlies/Farbe, Q2/Q3 Spachtelung, Brandschutzklasse A2</text>
      <line x1="0" y1="22" x2="525" y2="22" stroke="#F1F5F9"/>

      <!-- Schicht 2 -->
      <text x="0" y="38" font-weight="700" fill="#D97706">2. OSB/3-Platte 12 mm (Nut &amp; Feder / Stumpf)</text>
      <text x="0" y="52" font-size="10" fill="#64748B">Statische Wandscheibenaussteifung, fester Schraubgrund für Konsollasten ohne Dübel</text>
      <line x1="0" y1="60" x2="525" y2="60" stroke="#F1F5F9"/>

      <!-- Schicht 3 -->
      <text x="0" y="76" font-weight="700" fill="#B45309">3. KVH Ständer 80 mm + 80 mm Steinwolle</text>
      <text x="0" y="90" font-size="10" fill="#64748B">Konstruktionsvollholz C24 (e = 62,5 cm) + Rockwool/Isover Akustikdämmung WLG 035</text>
      <line x1="0" y1="98" x2="525" y2="98" stroke="#F1F5F9"/>

      <!-- Schicht 4 -->
      <text x="0" y="114" font-weight="700" fill="#D97706">4. OSB/3-Platte 12 mm (Raum B)</text>
      <text x="0" y="128" font-size="10" fill="#64748B">Zweite Wandscheibe für symmetrische Masse &amp; Resonanzdämpfung</text>
      <line x1="0" y1="136" x2="525" y2="136" stroke="#F1F5F9"/>

      <!-- Schicht 5 -->
      <text x="0" y="152" font-weight="700" fill="#475569">5. Gips-Karton-Platte 12,5 mm (Typ A / GKBI im Bad)</text>
      <text x="0" y="166" font-size="10" fill="#64748B">In Feuchträumen (Bäder/WCs) grüne imprägnierte GKBI-Feuchtraumplatte</text>
    </g>

    <!-- Key Performance Box -->
    <rect x="25" y="270" width="525" height="245" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="40" y="295" font-size="12" font-weight="800" fill="#0F172A">Bauphysikalische &amp; praktische Vorteile der 129 mm Wand:</text>
    
    <g transform="translate(40, 315)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#16A34A">✔ Hoher Schallschutz: Rw ≈ 51 - 53 dB (Sehr gut für Wohnen &amp; Schlafen)</text>
      <text x="0" y="16" font-size="10" fill="#475569">Biegeweiche GKB + biegesteife OSB brechen Resonanzen. Normale Gespräche sind unhörbar.</text>

      <text x="0" y="38" font-weight="700" fill="#2563EB">✔ Passgenau für Standard-Türzargen (130 mm Maulweite)</text>
      <text x="0" y="54" font-size="10" fill="#475569">Mit 129 mm passt jede Standard-Umfassungszarge (125-135 mm Verstellbereich) ohne teure Sonderanfertigung.</text>

      <text x="0" y="76" font-weight="700" fill="#B45309">✔ 4 cm Raumgewinn gegenüber 120er Wand (~ 1,2 m² mehr Wohnfläche!)</text>
      <text x="0" y="92" font-size="10" fill="#475569">Bei ca. 30 lfm Trennwänden im Haus gewinnen Sie spürbare Netto-Wohnfläche für Zimmer und Schränke.</text>

      <text x="0" y="114" font-weight="700" fill="#0F172A">✔ Ausreichend Bauraum für Installationen (80 mm Gefach)</text>
      <text x="0" y="130" font-size="10" fill="#475569">Tiefe Elektro-Schalterdosen (65 mm), Wasserleitungen und DN 50 Abwasserrohre passen problemlos hinein.</text>

      <text x="0" y="152" font-weight="700" fill="#D97706">✔ Volle Schraubfestigkeit ohne Hohlraumdübel</text>
      <text x="0" y="168" font-size="10" fill="#475569">Hängeschränke, Fernseher, Spiegel und Regale direkt mit Spax-Holzschrauben festdrehen (bis 50 kg/Schraube).</text>
    </g>
  </g>

</svg>
</body>
</html>
