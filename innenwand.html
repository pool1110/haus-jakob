<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innenwandaufbau mit 120 mm Steinwolle & Doppelbeplankung | Haus Jakob</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; color: #0F172A; overflow-x: hidden; }
        svg { display: block; width: 100%; height: 100%; max-height: 100vh; }
    </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; display: block; margin: 0; padding: 0;">
  
  <defs>
    <!-- Pattern für Steinwolle-Dämmung -->
    <pattern id="pat-steinwolle" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#FEF3C7"/>
      <path d="M 0,6 Q 6,0 12,6 T 24,6" fill="none" stroke="#D97706" stroke-width="1.2" opacity="0.6"/>
      <path d="M 0,18 Q 6,12 12,18 T 24,18" fill="none" stroke="#D97706" stroke-width="1.2" opacity="0.6"/>
    </pattern>

    <!-- Pattern für OSB-Platten -->
    <pattern id="pat-osb" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#FDE68A"/>
      <line x1="2" y1="5" x2="10" y2="5" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>
      <line x1="12" y1="15" x2="18" y2="15" stroke="#B45309" stroke-width="1.5" opacity="0.7"/>
      <line x1="5" y1="12" x2="15" y2="12" stroke="#92400E" stroke-width="1.2" opacity="0.6"/>
    </pattern>

    <!-- Pattern für Gipskarton -->
    <pattern id="pat-gipskarton" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#E2E8F0"/>
      <circle cx="8" cy="8" r="1" fill="#94A3B8"/>
      <circle cx="3" cy="3" r="0.8" fill="#64748B" opacity="0.5"/>
      <circle cx="13" cy="13" r="0.8" fill="#64748B" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Header -->
  <text x="50" y="45" font-size="20" font-weight="700" fill="#0F172A">3. Innenwandaufbau KfW-40 (169 mm | 12,5 mm Rigips + 12 mm OSB + 120 mm Steinwolle + 12 mm OSB + 12,5 mm Rigips)</text>
  <text x="50" y="68" font-size="13" font-weight="500" fill="#64748B">Schallschutz Rw ≥ 52 dB | F30-B Brandschutz | Massive Schraubfestigkeit für Hängeschränke &amp; TV | Horizontaler Schnitt</text>

  <!-- Button zur Außenwand -->
  <a href="wand.html" target="_self" style="cursor: pointer;">
    <rect x="790" y="32" width="160" height="32" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="870" y="52" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">➔ Zur Außenwand (374 mm)</text>
  </a>

  <line x1="50" y1="85" x2="950" y2="85" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Raumbezeichnungen -->
  <text x="70" y="115" font-size="12" font-weight="700" fill="#2563EB">RAUM A (z. B. Flur / Wohnbereich)</text>
  <text x="500" y="115" font-size="12" font-weight="700" text-anchor="end" fill="#16A34A">RAUM B (z. B. Schlafzimmer / Bad)</text>

  <!-- ==================== 2D VECTOR CUTAWAY LAYERS (LINKS NACH RECHTS) ==================== -->
  
  <!-- 1. Gips-Karton-Platte 12,5 mm (Raum A) -->
  <rect x="70" y="130" width="22" height="340" fill="url(#pat-gipskarton)" stroke="#64748B" stroke-width="1.5" rx="1"/>
  <text x="81" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">1</text>

  <!-- 2. OSB/3-Platte 12 mm (Raum A) -->
  <rect x="92" y="130" width="22" height="340" fill="url(#pat-osb)" stroke="#B45309" stroke-width="1.5" rx="1"/>
  <text x="103" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">2</text>

  <!-- 3. KVH Ständerwerk 120 mm + Steinwolle 120 mm -->
  <g id="layer-staender-steinwolle">
    <!-- Vollflächiges Gefach mit 120 mm Steinwolle gefüllt -->
    <rect x="114" y="130" width="250" height="340" fill="url(#pat-steinwolle)" stroke="#D97706" stroke-width="1.5"/>
    
    <!-- Oberer Holzständer KVH (120 mm Tiefe x 60 mm Breite) -->
    <rect x="114" y="130" width="250" height="45" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <line x1="114" y1="130" x2="364" y2="175" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="114" y1="175" x2="364" y2="130" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Unterer Holzständer KVH -->
    <rect x="114" y="425" width="250" height="45" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <line x1="114" y1="425" x2="364" y2="470" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="114" y1="470" x2="364" y2="425" stroke="#B45309" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Zentrierte Beschriftung im Gefach -->
    <rect x="144" y="270" width="190" height="55" rx="8" fill="#FFFFFF" fill-opacity="0.92" stroke="#E2E8F0" stroke-width="1"/>
    <text x="239" y="293" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">120 mm Steinwolle</text>
    <text x="239" y="312" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">(Akustik- &amp; Schallschutz WLG 035)</text>

    <!-- Ständerholz-Label -->
    <text x="239" y="157" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">KVH Ständerwerk 120 mm (Palmatin Werkssatz)</text>
    <text x="239" y="452" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Konstruktionsvollholz C24</text>
    <text x="239" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">3</text>
  </g>

  <!-- 4. OSB/3-Platte 12 mm (Raum B) -->
  <rect x="364" y="130" width="22" height="340" fill="url(#pat-osb)" stroke="#B45309" stroke-width="1.5" rx="1"/>
  <text x="375" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">4</text>

  <!-- 5. Gips-Karton-Platte 12,5 mm (Raum B) -->
  <rect x="386" y="130" width="22" height="340" fill="url(#pat-gipskarton)" stroke="#64748B" stroke-width="1.5" rx="1"/>
  <text x="397" y="495" font-size="11" font-weight="700" text-anchor="middle" fill="#0F172A">5</text>

  <!-- ==================== MASSKETTEN (UNTEN) ==================== -->
  <g transform="translate(0, 525)" font-size="10" font-family="'Inter', sans-serif">
    <!-- Maß 12,5 mm GKB -->
    <line x1="70" y1="0" x2="92" y2="0" stroke="#64748B" stroke-width="1.5"/>
    <line x1="70" y1="-5" x2="70" y2="5" stroke="#64748B" stroke-width="1.5"/>
    <line x1="92" y1="-5" x2="92" y2="5" stroke="#64748B" stroke-width="1.5"/>
    <text x="81" y="14" text-anchor="middle" font-weight="700" fill="#64748B">12,5</text>

    <!-- Maß 12 mm OSB -->
    <line x1="92" y1="0" x2="114" y2="0" stroke="#D97706" stroke-width="1.5"/>
    <line x1="114" y1="-5" x2="114" y2="5" stroke="#D97706" stroke-width="1.5"/>
    <text x="103" y="14" text-anchor="middle" font-weight="700" fill="#D97706">12</text>

    <!-- Maß 120 mm Steinwolle / Ständer -->
    <line x1="114" y1="0" x2="364" y2="0" stroke="#0F172A" stroke-width="2"/>
    <line x1="364" y1="-5" x2="364" y2="5" stroke="#0F172A" stroke-width="1.5"/>
    <text x="239" y="15" text-anchor="middle" font-size="11" font-weight="800" fill="#0F172A">120 mm Ständer / Steinwolle</text>

    <!-- Maß 12 mm OSB -->
    <line x1="364" y1="0" x2="386" y2="0" stroke="#D97706" stroke-width="1.5"/>
    <line x1="386" y1="-5" x2="386" y2="5" stroke="#D97706" stroke-width="1.5"/>
    <text x="375" y="14" text-anchor="middle" font-weight="700" fill="#D97706">12</text>

    <!-- Maß 12,5 mm GKB -->
    <line x1="386" y1="0" x2="408" y2="0" stroke="#64748B" stroke-width="1.5"/>
    <line x1="408" y1="-5" x2="408" y2="5" stroke="#64748B" stroke-width="1.5"/>
    <text x="397" y="14" text-anchor="middle" font-weight="700" fill="#64748B">12,5</text>

    <!-- Gesamtwandstärke Klammer -->
    <line x1="70" y1="32" x2="408" y2="32" stroke="#2563EB" stroke-width="2"/>
    <polyline points="65,32 75,28 75,36" fill="#2563EB"/>
    <polyline points="413,32 403,28 403,36" fill="#2563EB"/>
    <rect x="189" y="22" width="100" height="20" rx="4" fill="#2563EB"/>
    <text x="239" y="36" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">Gesamt: 169 mm</text>
  </g>

  <!-- ==================== RECHTS: STRUKTURIERTE TABELLE & HIGHLIGHTS ==================== -->
  <g transform="translate(530, 100)" font-size="12">
    <rect x="0" y="0" width="420" height="535" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="20" y="28" font-size="14" font-weight="800" fill="#0F172A">Schichtaufbau &amp; Dimensionierung (169 mm)</text>
    <text x="20" y="46" font-size="11" font-weight="500" fill="#64748B">Symmetrischer Trockenbauaufbau mit massiver Aussteifung:</text>

    <!-- Table Rows -->
    <g transform="translate(20, 68)" font-size="11">
      <!-- Schicht 1 -->
      <text x="0" y="0" font-weight="700" fill="#475569">1. Gips-Karton-Platte 12,5 mm (Typ A / GKB)</text>
      <text x="0" y="14" font-size="10" fill="#64748B">Glatte Oberfläche für Malervlies/Farbe, Q2/Q3 Spachtelung</text>
      <line x1="0" y1="22" x2="380" y2="22" stroke="#F1F5F9"/>

      <!-- Schicht 2 -->
      <text x="0" y="38" font-weight="700" fill="#D97706">2. OSB/3-Platte 12 mm (Nut &amp; Feder / Stumpf)</text>
      <text x="0" y="52" font-size="10" fill="#64748B">Statische Wandscheibenaussteifung, Tragschicht für Konsollasten</text>
      <line x1="0" y1="60" x2="380" y2="60" stroke="#F1F5F9"/>

      <!-- Schicht 3 -->
      <text x="0" y="76" font-weight="700" fill="#B45309">3. KVH Ständer 120 mm + 120 mm Steinwolle</text>
      <text x="0" y="90" font-size="10" fill="#64748B">Konstruktionsvollholz C24 (e = 62,5 cm) + Rockwool/Isover Akustikdämmung</text>
      <line x1="0" y1="98" x2="380" y2="98" stroke="#F1F5F9"/>

      <!-- Schicht 4 -->
      <text x="0" y="114" font-weight="700" fill="#D97706">4. OSB/3-Platte 12 mm (Raum B)</text>
      <text x="0" y="128" font-size="10" fill="#64748B">Beidseitige Doppelbeplankung für maximale Schalldämmung</text>
      <line x1="0" y1="136" x2="380" y2="136" stroke="#F1F5F9"/>

      <!-- Schicht 5 -->
      <text x="0" y="152" font-weight="700" fill="#475569">5. Gips-Karton-Platte 12,5 mm (Typ A / GKBI im Bad)</text>
      <text x="0" y="166" font-size="10" fill="#64748B">In Feuchträumen (Bäder/WCs) grüne imprägnierte GKBI-Platte</text>
    </g>

    <!-- Key Performance Box -->
    <rect x="20" y="270" width="380" height="245" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="295" font-size="12" font-weight="800" fill="#0F172A">Bauphysikalische Vorteile &amp; Eigenschaften:</text>
    
    <g transform="translate(35, 315)" font-size="11">
      <text x="0" y="0" font-weight="700" fill="#16A34A">✔ Hervorragender Schallschutz: Rw ≈ 52 - 55 dB</text>
      <text x="0" y="16" font-size="10" fill="#475569">Biegesteife OSB + biegeweiche GKB + 120 mm Steinwolle dämpfen Sprache &amp; TV optimal.</text>

      <text x="0" y="38" font-weight="700" fill="#2563EB">✔ Massive Lastenbefestigung überall möglich</text>
      <text x="0" y="54" font-size="10" fill="#475569">Schwere Hängeschränke, TV-Halterungen oder Waschtische direkt mit Spax (bis 50 kg/Schraube).</text>

      <text x="0" y="76" font-weight="700" fill="#B45309">✔ F30-B / EI 30 Brandschutzgeprüft</text>
      <text x="0" y="92" font-size="10" fill="#475569">Doppelbeplankung hemmt Brandausbreitung zwischen den Wohn- &amp; Schlafräumen.</text>

      <text x="0" y="114" font-weight="700" fill="#0F172A">✔ Großzügige Installationsebene (120 mm)</text>
      <text x="0" y="130" font-size="10" fill="#475569">Ausreichend Raum für Abwasserleitungen (DN 50/75), Kalt-/Warmwasser &amp; Elektro-Dosen.</text>

      <text x="0" y="152" font-weight="700" fill="#D97706">✔ Aufteilung Lieferumfang &amp; Montage</text>
      <text x="0" y="168" font-size="10" fill="#475569">Palmatin liefert Ständer + Steinwolle + 1. Lage OSB; 2. Lage OSB &amp; Rigips bauseits in DE.</text>
    </g>
  </g>

</svg>
</body>
</html>
