<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; display: block; margin: 0; padding: 0;">
  
  <!-- Header -->
  <text x="50" y="45" font-size="20" font-weight="700" fill="#0F172A">1. Thermobodenplatte / Schwedenplatte</text>
  <text x="50" y="68" font-size="13" font-weight="500" fill="#64748B">Schnittmodell: 200 mm Passivhaus-XPS + 200 mm Stahlbetonsohle | Vertikale Ausrichtung (unten bis oben)</text>

  <!-- Unified Legend Top-Right -->
  <g transform="translate(600, 32)" font-size="11" font-weight="600">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#64748B"/>
    <text x="18" y="10" fill="#334155">Bodenplatten-Fachbetrieb</text>

    <rect x="180" y="0" width="12" height="12" rx="3" fill="#F59E0B"/>
    <text x="198" y="10" fill="#334155">Palmatin Holzschwelle</text>
  </g>

  <line x1="50" y1="85" x2="950" y2="85" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Left: 2D Vector Drawing -->

  <!-- Ground Level GOK -->
  <line x1="50" y1="460" x2="140" y2="460" stroke="#8B5A2B" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="50" y="450" font-size="10" font-weight="600" fill="#8B5A2B">GOK</text>

  <!-- 1. Schottertragschicht (300 mm) -->
  <g id="layer-schotter">
    <rect x="140" y="480" width="400" height="90" fill="#64748B" opacity="0.15" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="180" cy="510" r="5" fill="#64748B" opacity="0.4"/><circle cx="260" cy="540" r="7" fill="#64748B" opacity="0.4"/>
    <circle cx="340" cy="515" r="6" fill="#64748B" opacity="0.4"/><circle cx="440" cy="540" r="8" fill="#64748B" opacity="0.4"/>
    <text x="340" y="530" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">1. Schottertragschicht (300 mm)</text>
  </g>

  <!-- 2. XPS Dämmung (200 mm Unter-Platte & L-Randschale) -->
  <g id="layer-xps">
    <rect x="140" y="415" width="400" height="65" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="470" y="250" width="70" height="230" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="300" y="452" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">2. XPS-Dämmung (200 mm)</text>
  </g>

  <!-- 3. Stahlbetonsohle (200 mm Kern) -->
  <g id="layer-beton">
    <rect x="140" y="315" width="330" height="100" fill="#94A3B8" opacity="0.3" stroke="#475569" stroke-width="1.5"/>
    <!-- Bewehrungsgitter -->
    <line x1="160" y1="335" x2="450" y2="335" stroke="#334155" stroke-width="2"/>
    <line x1="160" y1="395" x2="450" y2="395" stroke="#334155" stroke-width="2"/>
    <text x="300" y="370" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">3. Stahlbetonsohle (200 mm)</text>
  </g>

  <!-- 4. Integrierte PEX Heizrohre -->
  <g id="layer-heizung">
    <circle cx="180" cy="335" r="7" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
    <circle cx="240" cy="335" r="7" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
    <circle cx="300" cy="335" r="7" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
    <circle cx="360" cy="335" r="7" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
    <circle cx="420" cy="335" r="7" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="300" y="323" fill="#DC2626" font-size="10" font-weight="600" text-anchor="middle">4. Integrierte FBH (PEX)</text>
  </g>

  <!-- 5. Dampfsperre -->
  <g id="layer-dampfsperre">
    <line x1="330" y1="313" x2="470" y2="313" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="390" y="306" fill="#2563EB" font-size="10" font-weight="600">5. Dampfsperre</text>
  </g>

  <!-- 6. Oberbelag -->
  <g id="layer-finish">
    <rect x="140" y="302" width="190" height="13" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <text x="235" y="312" fill="#334155" font-size="9" font-weight="600" text-anchor="middle">6. Oberbelag / Sichtbeton</text>
  </g>

  <!-- 7. Palmatin Wandständer Schwelle -->
  <g id="layer-palmatin-wand" transform="translate(340, 110)">
    <rect x="0" y="150" width="190" height="52" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="95" y="180" fill="#B45309" font-size="11" font-weight="700" text-anchor="middle">7. Palmatin Schwelle (220 mm)</text>
    
    <!-- Wandständer -->
    <rect x="10" y="0" width="35" height="150" fill="#F59E0B" stroke="#D97706"/>
    <rect x="145" y="0" width="35" height="150" fill="#F59E0B" stroke="#D97706"/>
    <rect x="45" y="0" width="100" height="150" fill="#CBD5E1" opacity="0.4"/>
    <text x="95" y="75" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">Wandständer 220mm</text>
  </g>

  <!-- Right: Clean Summary Table -->
  <g transform="translate(580, 110)" font-size="12">
    <rect x="0" y="0" width="370" height="460" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0F172A">Schichtaufbau &amp; Gewerke</text>
    <text x="20" y="48" font-size="11" font-weight="500" fill="#64748B">Von oben (Wand) nach unten (Gründung):</text>

    <!-- Table Rows -->
    <g transform="translate(20, 70)">
      <!-- Row 7 -->
      <text x="0" y="0" font-weight="700" fill="#B45309">7. Holzschwelle (220 mm)</text>
      <text x="230" y="0" font-weight="600" fill="#D97706">[ Palmatin ]</text>
      <line x1="0" y1="12" x2="330" y2="12" stroke="#F1F5F9"/>

      <!-- Row 6 -->
      <text x="0" y="35" font-weight="700" fill="#334155">6. Oberbelag / Glattschliff</text>
      <text x="230" y="35" font-weight="600" fill="#64748B">[ Fachbetrieb ]</text>
      <line x1="0" y1="47" x2="330" y2="47" stroke="#F1F5F9"/>

      <!-- Row 5 -->
      <text x="0" y="70" font-weight="700" fill="#2563EB">5. Bitumen-Dampfsperre</text>
      <text x="230" y="70" font-weight="600" fill="#64748B">[ Fachbetrieb ]</text>
      <line x1="0" y1="82" x2="330" y2="82" stroke="#F1F5F9"/>

      <!-- Row 4 -->
      <text x="0" y="105" font-weight="700" fill="#DC2626">4. Integrierte PEX-Heizrohre</text>
      <text x="230" y="105" font-weight="600" fill="#64748B">[ Fachbetrieb ]</text>
      <line x1="0" y1="117" x2="330" y2="117" stroke="#F1F5F9"/>

      <!-- Row 3 -->
      <text x="0" y="140" font-weight="700" fill="#0F172A">3. Stahlbetonsohle (200 mm)</text>
      <text x="230" y="140" font-weight="600" fill="#64748B">[ Fachbetrieb ]</text>
      <line x1="0" y1="152" x2="330" y2="152" stroke="#F1F5F9"/>

      <!-- Row 2 -->
      <text x="0" y="175" font-weight="700" fill="#475569">2. XPS-Dämmung (200 mm)</text>
      <text x="230" y="175" font-weight="600" fill="#64748B">[ Fachbetrieb ]</text>
      <line x1="0" y1="187" x2="330" y2="187" stroke="#F1F5F9"/>

      <!-- Row 1 -->
      <text x="0" y="210" font-weight="700" fill="#64748B">1. Schottertragschicht (300 mm)</text>
      <text x="230" y="210" font-weight="600" fill="#64748B">[ Fachbetrieb ]</text>
    </g>

    <!-- Key Advantages Box -->
    <rect x="20" y="320" width="330" height="115" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="345" font-size="12" font-weight="700" fill="#0F172A">Vorteile dieser Konstruktion:</text>
    <text x="35" y="368" font-size="11" fill="#475569">• 200 mm Betonkern reicht statisch ideal für Holzrahmenbau</text>
    <text x="35" y="388" font-size="11" fill="#475569">• 200 mm XPS schützt lückenlos vor Erdreichkälte</text>
    <text x="35" y="408" font-size="11" fill="#475569">• Wandständer sitzt trocken &amp; geschützt auf XPS-L-Randschale</text>
  </g>

</svg>
