<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermobodenplatte Schnittmodell mit Sockelrücksprung | Haus Jakob</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; color: #0F172A; overflow-x: hidden; }
        svg { display: block; width: 100%; height: auto; max-height: 100vh; }
    </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Patterns -->
    <pattern id="pat-schotter" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#F1F5F9"/>
      <circle cx="5" cy="5" r="2.5" fill="#94A3B8"/>
      <circle cx="15" cy="8" r="3" fill="#CBD5E1"/>
      <circle cx="8" cy="15" r="2" fill="#94A3B8"/>
      <circle cx="17" cy="16" r="2.5" fill="#64748B"/>
    </pattern>

    <pattern id="pat-xps" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#FEF08A"/>
      <line x1="0" y1="16" x2="16" y2="0" stroke="#EAB308" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <pattern id="pat-beton" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#E2E8F0"/>
      <polygon points="4,4 8,10 2,8" fill="#94A3B8"/>
      <polygon points="16,14 20,20 14,18" fill="#94A3B8"/>
      <circle cx="18" cy="6" r="1.2" fill="#64748B"/>
      <circle cx="6" cy="18" r="1" fill="#64748B"/>
    </pattern>

    <pattern id="pat-holz" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#FDE68A"/>
      <line x1="0" y1="5" x2="20" y2="5" stroke="#D97706" stroke-width="0.8" opacity="0.7"/>
      <line x1="0" y1="15" x2="20" y2="15" stroke="#D97706" stroke-width="0.8" opacity="0.7"/>
    </pattern>

    <!-- Fassadendämmung (Steico) -->
    <pattern id="pat-steico" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#FEF9C3"/>
      <circle cx="6" cy="6" r="1.5" fill="#CA8A04" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Header Section -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#0F172A">1. Thermobodenplatte mit DIN-Sockelrücksprung (Tropfkante)</text>
    <text x="0" y="22" font-size="12" font-weight="500" fill="#64748B">Detail: Verjüngtes Sockel-XPS (80 mm) + 73 mm Fassadenüberstand (STEICO + HardiePlank) gegen Schlagregen</text>
  </g>

  <!-- Legend Badges Top Right -->
  <g transform="translate(630, 28)" font-size="11" font-weight="700">
    <rect x="0" y="0" width="10" height="10" rx="3" fill="#D97706"/>
    <text x="16" y="9" fill="#78350F">Palmatin Bausatz</text>

    <rect x="130" y="0" width="10" height="10" rx="3" fill="#0284C7"/>
    <text x="146" y="9" fill="#0369A1">Tropfblech / Sockel</text>

    <rect x="270" y="0" width="10" height="10" rx="3" fill="#CA8A04"/>
    <text x="286" y="9" fill="#854D0E">Verjüngtes XPS</text>
  </g>

  <line x1="40" y1="72" x2="960" y2="72" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ================= LEFT DIAGRAM (X: 30 to 520, Y: 85 to 610) ================= -->

  <!-- Ground Level GOK -->
  <line x1="20" y1="480" x2="110" y2="480" stroke="#8B5A2B" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="20" y="455" width="75" height="20" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="57" y="469" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">GOK (±0.00)</text>

  <!-- 1. Schottertragschicht (300 mm) -->
  <g id="layer-schotter">
    <rect x="110" y="480" width="410" height="90" fill="url(#pat-schotter)" stroke="#94A3B8" stroke-width="1.5" rx="2"/>
    <text x="315" y="530" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">1. Schottertragschicht (300 mm, 0-45 mm Korn)</text>
  </g>

  <!-- 2. Passivhaus-XPS Dämmung 200 mm & Verjüngte L-Randschale im Sockelbereich -->
  <g id="layer-xps">
    <!-- Unter-Platte (200 mm voll unter Sohle) -->
    <rect x="110" y="410" width="320" height="70" fill="url(#pat-xps)" stroke="#CA8A04" stroke-width="1.5"/>
    
    <!-- L-Randschale unten im Erdreich (200 mm dick) -->
    <rect x="430" y="410" width="80" height="70" fill="url(#pat-xps)" stroke="#CA8A04" stroke-width="1.5"/>
    
    <!-- Sockelelement oben über GOK (verjüngt auf 80 mm Sockeldämmung + Sockelputz!) -->
    <!-- Von y=270 bis y=410, x=430 bis x=465 (Breite 35px = 80 mm) -->
    <rect x="430" y="270" width="35" height="140" fill="url(#pat-xps)" stroke="#CA8A04" stroke-width="1.5"/>
    <!-- Sockelputz Außenseite -->
    <line x1="465" y1="275" x2="465" y2="480" stroke="#78350F" stroke-width="2.5"/>
    
    <text x="270" y="450" fill="#854D0E" font-size="12" font-weight="700" text-anchor="middle">2. Passivhaus-XPS Dämmung (200 mm)</text>
    <text x="448" y="345" fill="#854D0E" font-size="9" font-weight="800" text-anchor="middle" transform="rotate(-90 448 345)">Verjüngtes Sockel-XPS (80 mm)</text>
  </g>

  <!-- 3. Stahlbetonsohle (200 mm Betonkern C25/30) -->
  <g id="layer-beton">
    <rect x="110" y="270" width="320" height="140" fill="url(#pat-beton)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Bewehrungsgitter -->
    <line x1="125" y1="380" x2="415" y2="380" stroke="#334155" stroke-width="2.5"/>
    <line x1="125" y1="310" x2="415" y2="310" stroke="#334155" stroke-width="2.5"/>
    <!-- Bügel / Abstandshalter -->
    <line x1="160" y1="310" x2="160" y2="380" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="260" y1="310" x2="260" y2="380" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="360" y1="310" x2="360" y2="380" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <text x="270" y="350" fill="#0F172A" font-size="13" font-weight="800" text-anchor="middle">3. Stahlbetonsohle (200 mm C25/30)</text>
  </g>

  <!-- 4. Integrierte PEX Fußbodenheizung -->
  <g id="layer-fbh">
    <circle cx="150" cy="310" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="200" cy="310" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="250" cy="310" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="300" cy="310" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <circle cx="350" cy="310" r="7" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>
    <text x="250" y="298" fill="#DC2626" font-size="10" font-weight="700" text-anchor="middle">4. Integrierte PEX-Heizrohre (FBH)</text>
  </g>

  <!-- 5. Bitumen-Dampfsperre Katja BA -->
  <g id="layer-dampfsperre">
    <line x1="110" y1="270" x2="430" y2="270" stroke="#2563EB" stroke-width="3.5" stroke-dasharray="6,3"/>
  </g>

  <!-- 6. Oberbelag / Glattschliff -->
  <g id="layer-oberbelag">
    <rect x="110" y="255" width="100" height="15" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
    <text x="160" y="266" fill="#1E293B" font-size="9" font-weight="700" text-anchor="middle">6. Oberbelag / Estrich</text>
  </g>

  <!-- 7. Palmatin Schwelle & Außenwand + Fassadenaufbau (73 mm Auskragung) -->
  <g id="layer-palmatin-wand">
    <!-- Holzschwelle (220 mm breit) -->
    <rect x="210" y="230" width="220" height="40" fill="url(#pat-holz)" stroke="#D97706" stroke-width="2"/>
    <text x="320" y="254" fill="#78350F" font-size="11" font-weight="800" text-anchor="middle">7. Palmatin Schwelle (220 mm)</text>

    <!-- Wandständer KVH (220 mm Gefach) -->
    <rect x="210" y="90" width="30" height="140" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <rect x="400" y="90" width="30" height="140" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <rect x="240" y="90" width="160" height="140" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <text x="320" y="150" fill="#92400E" font-size="11" font-weight="700" text-anchor="middle">Palmatin Wandständer</text>
    <text x="320" y="166" fill="#B45309" font-size="10" font-weight="600" text-anchor="middle">(220 mm Gefach)</text>

    <!-- Fassadenaufbau Außen (73 mm: STEICO 35mm + Lattung 30mm + HardiePlank 8mm) -->
    <!-- X = 430 bis X = 478 (Breite 48px kragt über den Sockel 465 aus!) -->
    
    <!-- STEICO Holzfaserplatte (35 mm) -->
    <rect x="430" y="90" width="20" height="165" fill="url(#pat-steico)" stroke="#CA8A04" stroke-width="1"/>
    
    <!-- Lattung & Hinterlüftung (30 mm) -->
    <rect x="450" y="90" width="18" height="165" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="3,3"/>
    <rect x="450" y="110" width="18" height="30" fill="#DBEAFE" stroke="#2563EB"/>
    <rect x="450" y="190" width="18" height="30" fill="#DBEAFE" stroke="#2563EB"/>
    
    <!-- HardiePlank Zementfaser (8 mm) -->
    <rect x="468" y="90" width="10" height="165" fill="#475569" stroke="#0F172A" stroke-width="1"/>

    <!-- Sockel-Tropfblech Z-Profil (Kragt über Sockelputz aus!) -->
    <path d="M 425 260 L 480 260 L 480 270 L 476 270 L 476 264 L 425 264 Z" fill="#0284C7" stroke="#0369A1" stroke-width="1"/>
  </g>

  <!-- Visual Highlight Callout for Sockelrücksprung Tropfkante -->
  <g transform="translate(485, 235)">
    <!-- Red Drip Arrow -->
    <path d="M 0 35 L 0 55 M -4 50 L 0 58 L 4 50" stroke="#DC2626" stroke-width="2" fill="none"/>
    
    <!-- Drip Rain Drops -->
    <circle cx="0" cy="65" r="2.5" fill="#0284C7"/>
    <circle cx="0" cy="74" r="2" fill="#0284C7"/>

    <!-- Callout Box -->
    <rect x="15" y="20" width="125" height="42" rx="6" fill="#EFF6FF" stroke="#0284C7" stroke-width="1.5" shadow="sm"/>
    <text x="23" y="36" font-size="10" font-weight="800" fill="#0369A1">Sockelrücksprung</text>
    <text x="23" y="50" font-size="9" font-weight="600" fill="#0284C7">Tropfkante (DIN 18533)</text>
  </g>

  <!-- Pointer Line for Dampfsperre -->
  <rect x="15" y="260" width="85" height="20" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="57" y="274" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">5. Dampfsperre</text>


  <!-- ================= RIGHT SUMMARY CARD (X: 560 to 960, Y: 90 to 590) ================= -->
  <g transform="translate(560, 90)">
    <rect x="0" y="0" width="400" height="510" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="400" height="55" rx="16" fill="#F8FAFC"/>
    <path d="M 0 40 L 400 40 L 400 55 L 0 55 Z" fill="#F8FAFC"/>
    <text x="24" y="34" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#0F172A">Gründungs- &amp; Sockeldetails</text>
    <text x="376" y="34" font-size="11" font-weight="700" fill="#64748B" text-anchor="end">Mit Schlagregenschutz</text>
    <line x1="0" y1="55" x2="400" y2="55" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Table Content -->
    <g transform="translate(24, 75)" font-size="11">
      
      <!-- Row 7 -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" font-weight="700" fill="#92400E">7. Palmatin Holzschwelle (220 mm)</text>
        <rect x="250" y="-2" width="100" height="20" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
        <text x="300" y="12" font-weight="800" fill="#B45309" text-anchor="middle">Palmatin</text>
        <line x1="0" y1="26" x2="350" y2="26" stroke="#F1F5F9"/>
      </g>

      <!-- Row 6 -->
      <g transform="translate(0, 38)">
        <text x="0" y="12" font-weight="700" fill="#334155">6. Oberbelag / Glattschliff (15 mm)</text>
        <rect x="250" y="-2" width="100" height="20" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
        <text x="300" y="12" font-weight="700" fill="#475569" text-anchor="middle">Fachbetrieb / DIY</text>
        <line x1="0" y1="26" x2="350" y2="26" stroke="#F1F5F9"/>
      </g>

      <!-- Row 5 -->
      <g transform="translate(0, 76)">
        <text x="0" y="12" font-weight="700" fill="#1D4ED8">5. Bitumen-Dampfsperre Katja BA</text>
        <rect x="250" y="-2" width="100" height="20" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
        <text x="300" y="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Fachbetrieb</text>
        <line x1="0" y1="26" x2="350" y2="26" stroke="#F1F5F9"/>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 114)">
        <text x="0" y="12" font-weight="700" fill="#B91C1C">4. Integrierte PEX-Heizrohre (FBH)</text>
        <rect x="250" y="-2" width="100" height="20" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
        <text x="300" y="12" font-weight="700" fill="#B91C1C" text-anchor="middle">Fachbetrieb</text>
        <line x1="0" y1="26" x2="350" y2="26" stroke="#F1F5F9"/>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 152)">
        <text x="0" y="12" font-weight="700" fill="#0F172A">3. Stahlbetonsohle 200 mm (C25/30)</text>
        <rect x="250" y="-2" width="100" height="20" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>
        <text x="300" y="12" font-weight="700" fill="#334155" text-anchor="middle">Fachbetrieb</text>
        <line x1="0" y1="26" x2="350" y2="26" stroke="#F1F5F9"/>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 190)">
        <text x="0" y="12" font-weight="700" fill="#854D0E">2. XPS 200mm (Sockel verjüngt 80mm)</text>
        <rect x="250" y="-2" width="100" height="20" rx="6" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1"/>
        <text x="300" y="12" font-weight="700" fill="#854D0E" text-anchor="middle">Fachbetrieb</text>
        <line x1="0" y1="26" x2="350" y2="26" stroke="#F1F5F9"/>
      </g>

      <!-- Row 1 -->
      <g transform="translate(0, 228)">
        <text x="0" y="12" font-weight="700" fill="#475569">1. Schottertragschicht 300 mm</text>
        <rect x="250" y="-2" width="100" height="20" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
        <text x="300" y="12" font-weight="700" fill="#475569" text-anchor="middle">Bagger / Erdbau</text>
      </g>

    </g>

    <!-- Technical Specs Box at Bottom of Card -->
    <g transform="translate(20, 355)">
      <rect x="0" y="0" width="360" height="135" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="24" font-size="12" font-weight="800" fill="#0F172A">Lösung für den Sockelüberstand:</text>

      <g transform="translate(16, 44)" font-size="11" font-weight="500" fill="#334155">
        <text x="0" y="0">• <tspan font-weight="700" fill="#0369A1">Sockelrücksprung:</tspan> 73 mm Fassade kragt über Sockel aus</text>
        <text x="0" y="20">• <tspan font-weight="700" fill="#0F172A">Verjüngtes XPS:</tspan> 200 mm im Erdreich / 80 mm am Sockel</text>
        <text x="0" y="40">• <tspan font-weight="700" fill="#0F172A">Schlagregenschutz:</tspan> Wasser tropft am Z-Blech frei ab</text>
        <text x="0" y="60">• <tspan font-weight="700" fill="#0F172A">Kein Stauwasser:</tspan> Betonsohle ragt niemals ungeschützt raus</text>
      </g>
    </g>

  </g>

</svg>
</body>
</html>
