<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="100%" height="100%" style="background: #090d16; font-family: Inter, Arial, sans-serif;">
    <defs>
        <!-- Gravel Pattern -->
        <pattern id="pattern-gravel-file" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="#334155"/>
            <circle cx="4" cy="5" r="2.5" fill="#475569"/>
            <circle cx="14" cy="8" r="3" fill="#64748B"/>
            <circle cx="8" cy="15" r="2" fill="#475569"/>
            <circle cx="17" cy="16" r="2.5" fill="#64748B"/>
        </pattern>

        <!-- Concrete Pattern -->
        <pattern id="pattern-concrete-file" width="30" height="30" patternUnits="userSpaceOnUse">
            <rect width="30" height="30" fill="#64748B"/>
            <path d="M 5 5 L 9 12 L 2 10 Z" fill="#475569"/>
            <path d="M 20 18 L 24 25 L 17 23 Z" fill="#475569"/>
            <circle cx="22" cy="7" r="1.5" fill="#94A3B8"/>
            <circle cx="10" cy="22" r="1" fill="#94A3B8"/>
        </pattern>

        <!-- EPS/XPS Foam Pattern -->
        <pattern id="pattern-eps-file" width="16" height="16" patternUnits="userSpaceOnUse">
            <rect width="16" height="16" fill="#E2E8F0"/>
            <circle cx="4" cy="4" r="2" fill="#CBD5E1"/>
            <circle cx="12" cy="12" r="2" fill="#CBD5E1"/>
            <circle cx="12" cy="4" r="1.5" fill="#F1F5F9"/>
            <circle cx="4" cy="12" r="1.5" fill="#F1F5F9"/>
        </pattern>

        <!-- Cellulose Insulation Pattern -->
        <pattern id="pattern-cellulose-file" width="24" height="24" patternUnits="userSpaceOnUse">
            <rect width="24" height="24" fill="#94A3B8"/>
            <path d="M 2 4 Q 8 2 12 6 T 22 4" stroke="#64748B" stroke-width="1" fill="none"/>
            <path d="M 4 14 Q 10 12 16 16 T 24 14" stroke="#475569" stroke-width="1" fill="none"/>
            <circle cx="6" cy="10" r="1" fill="#cbd5e1"/>
            <circle cx="18" cy="20" r="1.2" fill="#cbd5e1"/>
        </pattern>

        <!-- Wood Grain Pattern -->
        <pattern id="pattern-wood-file" width="40" height="10" patternUnits="userSpaceOnUse">
            <rect width="40" height="10" fill="#D97706"/>
            <line x1="0" y1="3" x2="40" y2="3" stroke="#B45309" stroke-width="1"/>
            <line x1="0" y1="7" x2="40" y2="7" stroke="#92400E" stroke-width="0.8"/>
        </pattern>
    </defs>

    <!-- Title -->
    <text x="500" y="45" font-size="22" font-weight="bold" text-anchor="middle" fill="#F8FAFC">KfW-40 Holzhaus mit Thermobodenplatte (Von unten nach oben)</text>
    <text x="500" y="70" font-size="14" text-anchor="middle" fill="#38BDF8">Aufbau: 180 mm XPS + 200 mm Stahlbetonsohle &amp; 180 mm Wandständer</text>

    <!-- 1. THERMOBODENPLATTE (VON UNTEN NACH OBEN) -->
    <!-- A) Schottertragschicht ganz unten -->
    <rect x="150" y="700" width="700" height="100" fill="url(#pattern-gravel-file)" stroke="#334155" stroke-width="2"/>
    <text x="500" y="755" fill="#CBD5E1" font-size="14" font-weight="bold" text-anchor="middle">1. Schottertragschicht (300 mm, ausgehoben &amp; verdichtet)</text>

    <!-- B) XPS Dämmung 180 mm Unter-Platte -->
    <rect x="220" y="630" width="630" height="70" fill="url(#pattern-eps-file)" stroke="#94A3B8" stroke-width="2"/>
    <rect x="770" y="450" width="80" height="250" fill="url(#pattern-eps-file)" stroke="#94A3B8" stroke-width="2"/>
    <text x="500" y="670" fill="#334155" font-size="13" font-weight="bold" text-anchor="middle">2. Passivhaus-XPS-Dämmung (180 mm Unter-Platte &amp; L-Randschale)</text>

    <!-- C) Stahlbetonsohle 200 mm -->
    <rect x="220" y="530" width="550" height="100" fill="url(#pattern-concrete-file)" stroke="#475569" stroke-width="2"/>
    <text x="480" y="585" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">3. Stahlbetonsohle (200 mm Faserbeton / Bewehrung)</text>

    <!-- D) Integrierte Fußbodenheizung -->
    <circle cx="280" cy="550" r="9" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
    <circle cx="340" cy="550" r="9" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
    <circle cx="400" cy="550" r="9" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
    <circle cx="460" cy="550" r="9" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
    <circle cx="520" cy="550" r="9" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
    <circle cx="580" cy="550" r="9" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
    <circle cx="640" cy="550" r="9" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>

    <!-- E) Dampfsperre unter Schwelle -->
    <line x1="530" y1="528" x2="772" y2="528" stroke="#090D16" stroke-width="6"/>
    <line x1="530" y1="528" x2="772" y2="528" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8,4"/>

    <!-- 2. WANDAUFBAU (358 mm) -->
    <rect x="598" y="230" width="220" height="298" fill="url(#pattern-cellulose-file)" stroke="#64748B" stroke-width="1"/>
    <rect x="598" y="488" width="220" height="40" fill="url(#pattern-wood-file)" stroke="#78350F" stroke-width="2"/>
    <rect x="598" y="230" width="220" height="40" fill="url(#pattern-wood-file)" stroke="#78350F" stroke-width="2"/>
    <text x="708" y="380" fill="#1E293B" font-size="14" font-weight="bold" text-anchor="middle" transform="rotate(-90 708 380)">Zellulose (220 mm) + KVH Wandständer</text>

    <!-- Legend Footer -->
    <g transform="translate(220, 810)">
        <rect width="18" height="18" fill="#EAB308"/>
        <text x="26" y="14" fill="#EAB308" font-size="12" font-weight="bold">Holztragwerk (180 mm)</text>

        <rect x="220" width="18" height="18" fill="#64748B"/>
        <text x="246" y="14" fill="#CBD5E1" font-size="12" font-weight="bold">Thermobodenplatte (180 mm XPS + 200 mm Beton)</text>
    </g>
</svg>
